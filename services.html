<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Services – Psalm Eustoma</title>
  <meta name="description" content="Paris-based studio for cinematic portraits, weddings, and elopements.">
  <link rel="canonical" href="https://psalm-eustoma.pages.dev/services">
  <meta property="og:url" content="https://psalm-eustoma.pages.dev/services">
  <meta property="og:title" content="Psalm Eustoma – Paris-based Travel Photographer">
  <meta property="og:description" content="Paris-based studio for cinematic portraits, weddings, and elopements.">
  <meta property="og:image" content="">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Psalm Eustoma">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com">
  <link rel="preconnect" href="https://res.cloudinary.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Noto+Sans+TC:wght@200;300;400;500;700&family=Noto+Serif+TC:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="images/Favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="images/Favicon.svg">
  <meta name="theme-color" content="#000000">
  <script src="js/firebase-rest.js"></script>
</head>
<body>
  <div id="page-fade"></div>

  <!-- NAV -->
  <nav class="fade-down">
    <a href="index.html" class="nav-logo">Psalm Eustoma</a>
    <div class="nav-links">
      <a href="services.html">SERVICES</a>
      <a href="about.html">ABOUT</a>
      <a href="#" class="contact-link">CONTACT</a>
      <a href="#" id="langBtn">LANGUAGE</a>
    </div>
    <button class="hamburger" id="hamburger" aria-label="Open Menu">
      <span></span>
      <span></span>
    </button>
  </nav>

  <!-- SERVICES HERO -->
  <section class="services-hero" id="servicesHero">
    <div class="services-hero-text">
      <h1 class="services-hero-title fade-up" id="heroTitle"></h1>
      <p class="services-hero-sub fade-up delay-1" id="heroSub"></p>
    </div>
  </section>

  <!-- SERVICES CONTENT -->
  <section class="services-content">

    <!-- Photo grid (rendered by cms.js) -->
    <div class="services-grid" id="servicesGrid"></div>

    <!-- Category sidebar -->
    <aside class="services-sidebar">
      <div class="services-sidebar-inner">
        <p class="services-sidebar-label">Category</p>
        <div class="services-category-list" id="servicesCatList"></div>
      </div>
    </aside>

  </section>

  <!-- Floating booking button -->
  <a href="https://calendly.com/YOUR_USERNAME" target="_blank" class="project-booking-btn" aria-label="Book a session">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round">
      <rect x="3" y="4" width="18" height="17"/>
      <line x1="16" y1="2" x2="16" y2="6"/>
      <line x1="8" y1="2" x2="8" y2="6"/>
      <line x1="3" y1="9" x2="21" y2="9"/>
    </svg>
  </a>

  <!-- FOOTER -->
  <footer>
    <div class="footer-top">
      <div class="footer-main fade-up">
        <div class="footer-nav">
          <a href="services.html">SERVICES,</a>
          <a href="#">ABOUT,</a>
          <a href="#" class="contact-link">CONTACT,</a>
        </div>
        <div class="footer-social">
          <span class="footer-social-label">Follow</span>
        </div>
      </div>
      <div class="footer-copy-wrapper fade-up delay-1">
        <div class="footer-copy-line"></div>
        <p class="footer-copy">©2026 ALL RIGHTS RESERVED</p>
      </div>
    </div>
  </footer>

  <!-- MOBILE MENU OVERLAY -->
  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html" class="mobile-menu-logo">Psalm Eustoma</a>
    <button class="mobile-menu-close" id="mobileMenuClose" aria-label="Close Menu">
      <span></span>
      <span></span>
    </button>
    <div class="mobile-menu-body" style="margin-top: 60px;">
      <a href="services.html" class="mobile-menu-label">SERVICES</a>
      <div id="mobileMenuCats"></div>
      <div class="mobile-menu-divider"></div>
      <a href="about.html" class="mobile-menu-secondary">About</a>
      <a href="#" class="mobile-menu-secondary" id="langBtnMobile">Language</a>
    </div>
    <div class="mobile-menu-footer">
      <p class="mobile-menu-cta-label">Check Availability</p>
      <a href="#" class="mobile-menu-btn">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="display:block;"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
        Book a Session
      </a>
    </div>
  </div>

  <!-- LANGUAGE MODAL -->
  <div class="lang-overlay" id="langOverlay">
    <div class="lang-modal">
      <p class="lang-title">Select Language</p>
      <div class="lang-options">
        <button class="lang-option">English ( EN )</button>
        <button class="lang-option">Français ( FR )</button>
        <button class="lang-option"><span class="lang-zh">中文</span>&nbsp;( ZH )</button>
      </div>
    </div>
  </div>

  <script src="js/cms.js"></script>
  <script>
  window.dataReady.then(() => {
    const params    = new URLSearchParams(location.search);
    const catId     = params.get('cat');
    const d         = getCmsData();
    const cats      = (d.categories || []).slice().sort((a, b) => a.order - b.order);
    const allProjs  = (d.projects   || []).slice().sort((a, b) => a.order - b.order);
    const activeCat = catId ? cats.find(c => c.id === catId) : (cats[0] || null);
    const filtered  = catId ? allProjs.filter(p => p.categoryId === catId) : allProjs;

    // Hero
    const hero = document.getElementById('servicesHero');
    const heroBg = activeCat && (activeCat.heroImage || activeCat.image);
    if (hero && heroBg) {
      hero.style.backgroundImage = `url('${cmsImgFit(heroBg, 1600)}')`;
    }
    const titleEl = document.getElementById('heroTitle');
    if (titleEl) titleEl.textContent = activeCat ? getL10n(activeCat.name) : '';
    const subEl = document.getElementById('heroSub');
    if (subEl) subEl.textContent = activeCat ? (getL10n(activeCat.subtitle) || '') : '';

    // Project grid
    const grid = document.getElementById('servicesGrid');
    if (grid) {
      if (filtered.length === 0) {
        const emptyMsg = {
          en: 'No works in this category yet.',
          fr: 'Aucune œuvre dans cette catégorie pour le moment.',
          zh: '此分類尚無作品'
        };
        const msg = emptyMsg[getActiveLang()] || emptyMsg.en;
        grid.innerHTML = `<p style="color:#888;padding:60px 0;grid-column:1/-1;">${msg}</p>`;
      } else {
        const delays = ['', ' delay-1', ' delay-2', ' delay-3'];
        grid.innerHTML = filtered.map((p, i) => {
          const thumb = p.images && p.images[0] ? p.images[0] : '';
          const imgHtml = thumb
            ? `<img src="${cmsImgFit(thumb, 800)}" srcset="${cmsImgSrcset(thumb, [400, 600, 800, 1200])}" sizes="(max-width: 690px) 100vw, 50vw" alt="${getL10n(p.title)}" loading="lazy">`
            : `<div style="width:100%;height:100%;background:#f0f0ee;"></div>`;
          return `<a href="project.html?id=${p.id}" class="services-card fade-up${delays[i] || ''}">
            <div class="services-card-photo">
              ${imgHtml}
              <div class="services-card-overlay">
                <span class="services-card-see-more">see more</span>
                <svg class="services-card-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="5" y1="19" x2="19" y2="5"/>
                  <polyline points="8,5 19,5 19,16"/>
                </svg>
              </div>
            </div>
            <div class="services-card-info">
              <p class="services-card-title">${getL10n(p.title) || ''}</p>
              <p class="services-card-tags">${(p.tags || []).join('<br>')}</p>
            </div>
          </a>`;
        }).join('');
      }
    }

    // Sidebar categories
    const catList = document.getElementById('servicesCatList');
    if (catList) {
      catList.innerHTML = cats.map((cat, i) => {
        const isActive = activeCat && cat.id === activeCat.id;
        return `<a href="services.html?cat=${cat.id}" class="services-category-item${isActive ? ' active' : ''}">
          <span class="services-category-num">(${i + 1})</span>
          <span class="services-category-name">${getL10n(cat.name)}</span>
        </a>`;
      }).join('');
    }
  });
  </script>
  <script src="js/main.js"></script>

</body>
</html>
