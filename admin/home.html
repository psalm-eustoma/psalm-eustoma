<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>首頁編輯 — Psalm Eustoma 後台</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
  <style>
    /* ── Card groups (home-specific) ── */
    .card-group { display:flex; gap:16px; }
    .card-item { flex:1; background:#fafaf8; border:1px solid var(--border); border-radius:6px; padding:16px; }
    .card-item-num { font-size:11px; color:var(--text-mid); letter-spacing:0.06em; margin-bottom:12px; }
    .media-type-row { display:flex; gap:12px; align-items:center; margin-bottom:10px; }
    .media-type-row label { display:flex; align-items:center; gap:5px; font-size:12px; font-weight:300; cursor:pointer; }

    /* ── Preview: Banner (mobile = stacked) ── */
    .pv-banner { background:#111; }
    .pv-banner-video { width:100%; height:500px; background:#1a1a1a; display:flex; align-items:center; justify-content:center; }
    .pv-video-ring { width:22px; height:22px; border-radius:50%; border:1.5px solid rgba(255,255,255,0.35); display:flex; align-items:center; justify-content:center; }
    .pv-video-ring::after { content:''; border-left:7px solid rgba(255,255,255,0.5); border-top:4px solid transparent; border-bottom:4px solid transparent; margin-left:2px; }
    .pv-banner-hero { width:100%; background:#111; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:28px 28px 24px; min-height:220px; }
    .pv-hero-img { width:78%; height:140px; background:#333 no-repeat center/cover; margin-bottom:14px; }
    .pv-tagline { font-family:'Helvetica Neue',Arial,sans-serif; font-size:7px; font-weight:300; color:#fff; line-height:1.55; text-align:center; }
    .pv-placeholder { color:#888 !important; }

    /* ── Preview: Quote (full-height, background image) ── */
    .pv-quote-sec { min-height:300px; padding:36px 20px; text-align:center; background:#555 url('../images/background pic.webp') center/cover; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0; }
    .pv-q-eyebrow { font-family:'Helvetica Neue',Arial,sans-serif; font-size:8px; font-weight:300; color:#686868; letter-spacing:0.04em; margin-bottom:12px; }
    .pv-q-main { font-family:'Cormorant Garamond',Georgia,serif; font-style:italic; font-size:13px; font-weight:400; color:#111; line-height:1.5; margin-bottom:12px; max-width:200px; }
    .pv-q-note { font-family:'Helvetica Neue',Arial,sans-serif; font-size:7.5px; font-weight:300; color:#888; }

    /* ── Preview: Media sections ── */
    .pv-media-sec { padding:32px 14px 20px; border-top:1px solid #eee; }
    .pv-media-title { font-family:'Cormorant Garamond',Georgia,serif; font-size:16px; font-weight:400; letter-spacing:-0.02em; color:#111; text-align:center; margin-bottom:10px; }
    .pv-media-desc { font-family:'Helvetica Neue',Arial,sans-serif; font-size:8px; font-weight:300; color:#686868; line-height:1.5; margin-bottom:14px; text-align:center; }
    /* Cards: horizontal scroll, fixed width — matches mobile frontend */
    .pv-cards { display:flex; gap:8px; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding-bottom:2px; }
    .pv-cards::-webkit-scrollbar { display:none; }
    .pv-card-wrap { flex:0 0 155px; scroll-snap-align:start; }
    .pv-mini-card { width:100%; aspect-ratio:488/624; background:#efefed no-repeat center/cover; position:relative; overflow:hidden; }
    .pv-play { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.22); }
    .pv-play-btn { width:13px; height:13px; border-radius:50%; background:rgba(255,255,255,0.85); display:flex; align-items:center; justify-content:center; }
    .pv-play-btn::after { content:''; border-left:5px solid #333; border-top:3px solid transparent; border-bottom:3px solid transparent; margin-left:1px; }
    /* Label overlaid at bottom of card */
    .pv-card-inner-label { position:absolute; bottom:0; left:0; right:0; background:rgba(255,255,255,0.7); font-family:'Helvetica Neue',Arial,sans-serif; font-size:7px; font-weight:300; letter-spacing:0.06em; color:#111; text-align:center; padding:4px 2px; }
  </style>
  <link rel="icon" href="../images/Favicon.svg" type="image/svg+xml">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="../js/firebase-init.js"></script>
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar">
    <div class="sidebar-logo"><strong>Psalm Eustoma</strong><span>後台管理</span></div>
    <div class="sidebar-top-action">
      <a class="btn-view-site" href="../index.html" target="_blank">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        前往前台
      </a>
    </div>
    <nav class="sidebar-nav">
      <a href="home.html"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>首頁編輯</a>
      <a href="categories.html"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18M3 12h18M3 17h18"/></svg>分類管理</a>
      <a href="projects.html"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>作品列表</a>
      <a href="about.html"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 1 0-16 0"/></svg>About 頁</a>
      <a href="settings.html"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v2m0 16v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M2 12h2m16 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>聯絡資訊</a>
    </nav>
    <div class="sidebar-footer"><button class="btn-logout" id="logoutBtn">登出</button></div>
  </aside>

  <main class="main">
    <div class="page-header">
      <h1 class="page-title">首頁編輯</h1>
    </div>

    <div class="edit-layout">

      <!-- ── Left: Form ── -->
      <div class="edit-form-col">
        <div class="tab-container">
          <div class="tab-bar">
            <button class="tab-btn active" data-tab="banner">Banner</button>
            <button class="tab-btn" data-tab="quote">Quote</button>
            <button class="tab-btn" data-tab="photo">平面</button>
            <button class="tab-btn" data-tab="video">影音</button>
          </div>

          <div class="tab-body">

            <!-- ── Tab: Banner ── -->
            <div class="tab-panel active" id="tab-banner">
              <div class="form-group">
                <label class="form-label">影片連結（左側自動播放，共用）</label>
                <div class="img-row">
                  <input class="form-input" type="url" id="bannerVideo" placeholder="https://... .mp4">
                  <button type="button" class="btn-upload-img" onclick="triggerImgUpload(document.getElementById('bannerVideo'),this,'video/mp4',{mp4Only:true})">↑ 上傳</button>
                </div>
                <p class="form-hint">建議 1080 × 1920 px（直式 9:16），請用 MP4（iPhone 才能順暢播放，會自動壓到 1080p）</p>
              </div>
              <div class="form-group">
                <label class="form-label">右側背景圖連結（共用）</label>
                <div class="img-row">
                  <input class="form-input" type="url" id="bannerHeroImg" placeholder="https://... .webp / .jpg">
                  <button type="button" class="btn-upload-img" onclick="triggerImgUpload(document.getElementById('bannerHeroImg'),this)">↑ 上傳</button>
                </div>
                <p class="form-hint">建議 1440 × 1800 px（直式 4:5）</p>
              </div>
              <div class="form-group" style="margin-bottom:0;">
                <label class="form-label">Tagline 文字</label>
                <div id="bannerTaglineField"></div>
              </div>
            </div>

            <!-- ── Tab: Quote ── -->
            <div class="tab-panel" id="tab-quote">
              <div class="form-group">
                <label class="form-label">上方小字</label>
                <div id="quoteEyebrowField"></div>
              </div>
              <div class="form-group">
                <label class="form-label">主要文字</label>
                <div id="quoteMainField"></div>
              </div>
              <div class="form-group" style="margin-bottom:0;">
                <label class="form-label">下方小字</label>
                <div id="quoteNoteField"></div>
              </div>
            </div>

            <!-- ── Tab: Photography ── -->
            <div class="tab-panel" id="tab-photo">
              <div class="form-group">
                <label class="form-label">段落描述</label>
                <div id="photoDescField"></div>
              </div>
              <label class="form-label" style="display:block;margin-bottom:12px;">三件作品</label>
              <div class="card-group" id="photoCards"></div>
            </div>

            <!-- ── Tab: Video / Social ── -->
            <div class="tab-panel" id="tab-video">
              <div class="form-group">
                <label class="form-label">段落描述</label>
                <div id="videoDescField"></div>
              </div>
              <label class="form-label" style="display:block;margin-bottom:12px;">三件作品</label>
              <div class="card-group" id="videoCards"></div>
            </div>

          </div><!-- .tab-body -->
        </div><!-- .tab-container -->

        <div class="save-bar">
          <button class="btn btn-primary" id="saveBtn">儲存所有變更</button>
        </div>
      </div><!-- .edit-form-col -->

      <!-- ── Right: Phone preview ── -->
      <div class="edit-preview-col">
        <div class="preview-label">手機預覽</div>
        <div class="phone-frame">
          <div class="phone-screen" id="phoneScreen">
            <div class="pv-nav">
              <span class="pv-logo">Psalm Eustoma</span>
              <div class="pv-hamburger"><span></span><span></span></div>
            </div>

            <!-- Banner (mobile: stacked) -->
            <div id="pvBanner" class="pv-banner">
              <div class="pv-banner-video">
                <div class="pv-video-ring"></div>
              </div>
              <div class="pv-banner-hero">
                <div class="pv-hero-img" id="pvHeroBg"></div>
                <div class="pv-tagline pv-placeholder" id="pvTagline">Tagline 文字…</div>
              </div>
            </div>

            <!-- Quote -->
            <div id="pvQuote" class="pv-quote-sec">
              <div class="pv-q-eyebrow pv-placeholder" id="pvQEyebrow">上方小字</div>
              <div class="pv-q-main pv-placeholder" id="pvQMain">主要文字將顯示於此…</div>
              <div class="pv-q-note pv-placeholder" id="pvQNote">下方小字</div>
            </div>

            <!-- Photography -->
            <div id="pvPhoto" class="pv-media-sec">
              <div class="pv-media-title">PHOTOGRAPHY</div>
              <div class="pv-media-desc pv-placeholder" id="pvPhotoDesc">段落描述…</div>
              <div class="pv-cards" id="pvPhotoCards">
                <div class="pv-card-wrap"><div class="pv-mini-card"><div class="pv-card-inner-label pv-placeholder">LABEL</div></div></div>
                <div class="pv-card-wrap"><div class="pv-mini-card"><div class="pv-card-inner-label pv-placeholder">LABEL</div></div></div>
                <div class="pv-card-wrap"><div class="pv-mini-card"><div class="pv-card-inner-label pv-placeholder">LABEL</div></div></div>
              </div>
            </div>

            <!-- Video / Social -->
            <div id="pvVideo" class="pv-media-sec">
              <div class="pv-media-title">VIDEO / SOCIAL</div>
              <div class="pv-media-desc pv-placeholder" id="pvVideoDesc">段落描述…</div>
              <div class="pv-cards" id="pvVideoCards">
                <div class="pv-card-wrap"><div class="pv-mini-card"><div class="pv-card-inner-label pv-placeholder">LABEL</div></div></div>
                <div class="pv-card-wrap"><div class="pv-mini-card"><div class="pv-card-inner-label pv-placeholder">LABEL</div></div></div>
                <div class="pv-card-wrap"><div class="pv-mini-card"><div class="pv-card-inner-label pv-placeholder">LABEL</div></div></div>
              </div>
            </div>

          </div><!-- .phone-screen -->
        </div><!-- .phone-frame -->
        <p class="preview-note">預覽顯示 EN 語言版本</p>
      </div><!-- .edit-preview-col -->

    </div><!-- .edit-layout -->
  </main>
</div>

<script src="js/admin.js"></script>
<script>
  let videoCardTypes = [];

  // ── Tab switching ──
  const TAB_FIELDS = {
    banner: ['bannerTagline'],
    quote:  ['quoteEyebrow', 'quoteMain', 'quoteNote'],
    photo:  ['photoDesc', 'pcLabel0', 'pcLabel1', 'pcLabel2'],
    video:  ['videoDesc', 'vcLabel0', 'vcLabel1', 'vcLabel2']
  };

  const TAB_PREVIEW_SECTION = {
    banner: 'pvBanner',
    quote:  'pvQuote',
    photo:  'pvPhoto',
    video:  'pvVideo'
  };

  function switchTab(name) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'tab-' + name));
    const targetId = TAB_PREVIEW_SECTION[name];
    const screen = document.getElementById('phoneScreen');
    const target = document.getElementById(targetId);
    if (screen && target) screen.scrollTo({ top: target.offsetTop - 46, behavior: 'smooth' });
  }

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  // ── Card rendering ──
  function renderMediaCards(containerId, cards, prefix, showVideoToggle) {
    document.getElementById(containerId).innerHTML = cards.map((card, i) => `
      <div class="card-item">
        <div class="card-item-num">作品 ${i + 1}</div>
        ${showVideoToggle ? `
        <div class="media-type-row">
          <label><input type="radio" name="${prefix}Type${i}" value="image" ${!card.isVideo ? 'checked' : ''}
            onchange="updateCardType('${prefix}',${i},false)"> 圖片</label>
          <label><input type="radio" name="${prefix}Type${i}" value="video" ${card.isVideo ? 'checked' : ''}
            onchange="updateCardType('${prefix}',${i},true)"> 影片</label>
        </div>` : ''}
        <div class="form-group" style="margin-bottom:10px;">
          <label class="form-label" id="${prefix}UrlLabel${i}">${showVideoToggle && card.isVideo ? '影片' : '圖片'}連結（共用）</label>
          <div class="img-row">
            <input class="form-input" type="url" id="${prefix}Url${i}" value="${card.mediaUrl || ''}" placeholder="https://...">
            <button type="button" class="btn-upload-img" id="${prefix}UpBtn${i}"
              onclick="triggerImgUpload(document.getElementById('${prefix}Url${i}'),this,${showVideoToggle && card.isVideo ? `'video/*'` : `'image/*'`})">↑ 上傳</button>
          </div>
          <p class="form-hint">${showVideoToggle && card.isVideo ? '建議 1080 × 1920 px（直式 9:16），MP4 或 WebM' : '建議 1440 × 1800 px（直式 4:5）'}</p>
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label">標籤文字</label>
          ${mlFieldHTML(`${prefix}Label${i}`, card.label, { placeholder: 'WEDDING' })}
        </div>
      </div>
    `).join('');
  }

  function updateCardType(prefix, i, isVideo) {
    if (prefix === 'vc') videoCardTypes[i] = isVideo;
    const lbl = document.getElementById(`${prefix}UrlLabel${i}`);
    if (lbl) lbl.textContent = (isVideo ? '影片' : '圖片') + '連結（共用）';
    updatePreview();
  }

  // ── Live preview (EN only) ──
  function getEN(id) {
    const el = document.getElementById(`${id}-en`);
    return el ? el.value.trim() : '';
  }

  function pvSet(elId, value, placeholder) {
    const el = document.getElementById(elId);
    if (!el) return;
    el.textContent = value || placeholder;
    el.classList.toggle('pv-placeholder', !value);
  }

  function updatePreview() {
    // Banner
    const heroImg = document.getElementById('bannerHeroImg').value.trim();
    const pvHeroBg = document.getElementById('pvHeroBg');
    if (pvHeroBg) pvHeroBg.style.backgroundImage = heroImg ? `url('${heroImg}')` : '';
    pvSet('pvTagline', getEN('bannerTagline'), 'Tagline 文字…');

    // Quote
    pvSet('pvQEyebrow', getEN('quoteEyebrow'), '上方小字');
    pvSet('pvQMain',    getEN('quoteMain'),    '主要文字將顯示於此…');
    pvSet('pvQNote',    getEN('quoteNote'),    '下方小字');

    // Photo cards
    pvSet('pvPhotoDesc', getEN('photoDesc'), '段落描述…');
    const pvPhotoCards = document.getElementById('pvPhotoCards');
    if (pvPhotoCards) {
      const wraps = pvPhotoCards.querySelectorAll('.pv-card-wrap');
      for (let i = 0; i < 3; i++) {
        const url   = document.getElementById(`pcUrl${i}`)?.value.trim() || '';
        const label = getEN(`pcLabel${i}`);
        if (wraps[i]) {
          const card = wraps[i].querySelector('.pv-mini-card');
          const lbl  = wraps[i].querySelector('.pv-card-inner-label');
          if (card) card.style.backgroundImage = url ? `url('${url}')` : '';
          if (lbl)  { lbl.textContent = label || 'LABEL'; lbl.classList.toggle('pv-placeholder', !label); }
        }
      }
    }

    // Video cards
    pvSet('pvVideoDesc', getEN('videoDesc'), '段落描述…');
    const pvVideoCards = document.getElementById('pvVideoCards');
    if (pvVideoCards) {
      const wraps = pvVideoCards.querySelectorAll('.pv-card-wrap');
      for (let i = 0; i < 3; i++) {
        const url     = document.getElementById(`vcUrl${i}`)?.value.trim() || '';
        const label   = getEN(`vcLabel${i}`);
        const isVideo = videoCardTypes[i] || false;
        if (wraps[i]) {
          const card     = wraps[i].querySelector('.pv-mini-card');
          const lbl      = wraps[i].querySelector('.pv-card-inner-label');
          const playDiv  = wraps[i].querySelector('.pv-play');
          if (card) card.style.backgroundImage = url ? `url('${url}')` : '';
          if (lbl)  { lbl.textContent = label || 'LABEL'; lbl.classList.toggle('pv-placeholder', !label); }
          // toggle play icon
          if (!playDiv && isVideo && card) {
            const p = document.createElement('div');
            p.className = 'pv-play';
            p.innerHTML = '<div class="pv-play-btn"></div>';
            card.appendChild(p);
          } else if (playDiv && !isVideo) {
            playDiv.remove();
          }
        }
      }
    }
  }

  function attachPreviewListeners() {
    document.getElementById('bannerHeroImg').addEventListener('input', updatePreview);
    document.getElementById('bannerVideo').addEventListener('input', updatePreview);
    document.querySelector('.tab-body').addEventListener('input', updatePreview);
  }

  // ── Load ──
  function load() {
    const h = getHome();
    document.getElementById('bannerVideo').value   = h.banner.videoUrl    || '';
    document.getElementById('bannerHeroImg').value = h.banner.heroImageUrl || '';

    document.getElementById('bannerTaglineField').innerHTML = mlFieldHTML('bannerTagline', h.banner.tagline, { placeholder: 'Where light moves gently...' });
    document.getElementById('quoteEyebrowField').innerHTML  = mlFieldHTML('quoteEyebrow',  h.quote.eyebrow,  { placeholder: 'Light begins in silence.' });
    document.getElementById('quoteMainField').innerHTML     = mlFieldHTML('quoteMain',     h.quote.main,     { textarea: true, rows: 3, placeholder: 'In quiet spaces, light takes shape...' });
    document.getElementById('quoteNoteField').innerHTML     = mlFieldHTML('quoteNote',     h.quote.note,     { placeholder: 'Every image is a balance of presence and intention.' });
    document.getElementById('photoDescField').innerHTML     = mlFieldHTML('photoDesc',     h.photography.description, { textarea: true, rows: 2, placeholder: 'Observing the quiet rhythm of the city...' });
    document.getElementById('videoDescField').innerHTML     = mlFieldHTML('videoDesc',     h.videoSocial.description, { textarea: true, rows: 2, placeholder: 'Honest and unposed...' });

    videoCardTypes = h.videoSocial.cards.map(c => !!c.isVideo);
    renderMediaCards('photoCards', h.photography.cards, 'pc', false);
    renderMediaCards('videoCards', h.videoSocial.cards, 'vc', true);
    refreshImgPreviews();

    // Build initial video card play icons in preview
    const pvVideoCards = document.getElementById('pvVideoCards');
    if (pvVideoCards) {
      const wraps = pvVideoCards.querySelectorAll('.pv-card-wrap');
      for (let i = 0; i < 3; i++) {
        if (videoCardTypes[i] && wraps[i]) {
          const card = wraps[i].querySelector('.pv-mini-card');
          if (card && !card.querySelector('.pv-play')) {
            const p = document.createElement('div');
            p.className = 'pv-play';
            p.innerHTML = '<div class="pv-play-btn"></div>';
            card.appendChild(p);
          }
        }
      }
    }

    attachPreviewListeners();
    updatePreview();
    initDirtyGuard();
  }

  // ── Validate all tabs; switch to first failing tab ──
  function collectAndValidate() {
    let valid = true;
    let firstFailTab = null;
    const results = {};

    Object.entries(TAB_FIELDS).forEach(([tab, fields]) => {
      fields.forEach(id => {
        const val = validateML(id, false);
        if (val === false) {
          valid = false;
          if (!firstFailTab) firstFailTab = tab;
        } else {
          results[id] = val;
        }
      });
    });

    if (!valid) { switchTab(firstFailTab); return null; }
    return results;
  }

  // ── Save ──
  document.getElementById('saveBtn').addEventListener('click', () => {
    const r = collectAndValidate();
    if (!r) return;

    saveHome({
      banner: {
        videoUrl:     document.getElementById('bannerVideo').value.trim(),
        heroImageUrl: document.getElementById('bannerHeroImg').value.trim(),
        tagline:      r.bannerTagline
      },
      quote:  { eyebrow: r.quoteEyebrow, main: r.quoteMain, note: r.quoteNote },
      photography: {
        description: r.photoDesc,
        cards: Array.from({ length: 3 }, (_, i) => ({
          mediaUrl: document.getElementById(`pcUrl${i}`)?.value.trim() || '',
          label:    r[`pcLabel${i}`],
          isVideo:  false
        }))
      },
      videoSocial: {
        description: r.videoDesc,
        cards: Array.from({ length: 3 }, (_, i) => ({
          mediaUrl: document.getElementById(`vcUrl${i}`)?.value.trim() || '',
          label:    r[`vcLabel${i}`],
          isVideo:  videoCardTypes[i] || false
        }))
      }
    });

    markClean();
    showSaveToast();
  });

  window.dataReady.then(() => load());
</script>
</body>
</html>
